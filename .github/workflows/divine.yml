name: Divine iOS build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'

      - name: Install tools
        run: brew install ldid lld make coreutils

      - name: Build ipa
        run: |
          export PATH="$(brew --prefix make)/libexec/gnubin:$(brew --prefix lld)/bin:$(brew --prefix coreutils)/libexec/gnubin:$PATH"
          make -j$(sysctl -n hw.ncpu) package PLATFORM=2 BOOTJDK="$JAVA_HOME/bin" RUNNER=1

      - uses: actions/upload-artifact@v4
        with:
          name: Divine-iOS
          path: artifacts/*.ipa
          if-no-files-found: error
